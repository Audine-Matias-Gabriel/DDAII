name: CI

# Corre en todo Pull Request (el equipo integra en try-nuevo y después en main)
# y en cada push a las ramas de integración.
on:
  push:
    branches: [ main, try-nuevo ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Los tests son unitarios (Mockito/MockMvc): no necesitan Postgres ni RabbitMQ.
      - name: mvn test
        run: mvn -B test
        working-directory: tienda/backend

  frontend:
    name: Frontend (npm test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: npm install
        run: npm install --no-audit --no-fund
        working-directory: tienda/frontend

      - name: npm test
        run: npm test
        working-directory: tienda/frontend

      - name: npm run build
        run: npm run build
        working-directory: tienda/frontend

  scraper:
    name: Scraper (npm test, sin internet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: tienda/scraper/package-lock.json

      - name: npm ci && npm test
        run: npm ci && npm test
        working-directory: tienda/scraper
