spring.application.name=tienda-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/tienda
spring.datasource.username=tienda
spring.datasource.password=tienda
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tienda
spring.rabbitmq.password=tienda_dev_123

# Confirmaciones de publicacion: sin esto, send() no espera el ack del broker
# y un mensaje rechazado se pierde en silencio.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Tiempo maximo que se espera el ack del broker antes de dar por fallida la
# publicacion del pedido.
tienda.rabbitmq.confirm-timeout=5s

# Un mensaje que el consumidor rechaza no vuelve a encolarse en caliente:
# el broker lo manda a la cola de mensajes muertos (tienda.pedidos.creado.dlq).
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Si la cola todavia no existe (broker caido al arrancar), el consumidor
# reintenta en vez de morir.
spring.rabbitmq.listener.simple.missing-queues-fatal=false
