services:
  postgres:
    image: postgres:16-alpine
    container_name: tienda-postgres
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d tienda"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tienda-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./tienda/backend
      dockerfile: Dockerfile
    container_name: tienda-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tienda
      DB_USER: tienda
      DB_PASSWORD: tienda
      RABBIT_URI_HOST: rabbitmq
      RABBIT_URI_PORT: 5672
      RABBIT_URI_USERNAME: guest
      RABBIT_URI_PASSWORD: guest
      RABBIT_EXCHANGE: tienda.exchange
      # ":-" para que una variable vacía (sin .env) use el default y no "" (XIMILAR_MOCK="" rompe el arranque)
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_BASE_URL: ${MP_BASE_URL:-https://api.mercadopago.com}
      # Acepta XIMILAR_API_KEY o XIMILAR_API_TOKEN (el nombre que usaba el servicio Node)
      XIMILAR_API_KEY: ${XIMILAR_API_KEY:-${XIMILAR_API_TOKEN:-}}
      XIMILAR_COLLECTION_ID: ${XIMILAR_COLLECTION_ID:-}
      XIMILAR_BASE_URL: ${XIMILAR_BASE_URL:-https://api.ximilar.com}
      XIMILAR_MOCK: ${XIMILAR_MOCK:-false}
      XIMILAR_INDEXADO_AUTOMATICO: ${XIMILAR_INDEXADO_AUTOMATICO:-true}
      XIMILAR_MAXIMO_POR_CORRIDA: ${XIMILAR_MAXIMO_POR_CORRIDA:-100}
      XIMILAR_MAXIMO_COLECCION: ${XIMILAR_MAXIMO_COLECCION:-1000}
      CORS_ORIGINS: http://localhost:5173,http://frontend
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"

  scraper:
    build:
      context: ./tienda/scraper
      dockerfile: Dockerfile
    container_name: tienda-scraper
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: tienda.exchange
      TIENDAS: SPORTLINE,GRID
      SCHEDULER_CRON: "0 2 * * *"
      # 300 por tienda para que el catálogo tenga variedad (las primeras páginas son casi todo calzado)
      MAX_PRODUCTS: ${MAX_PRODUCTS:-300}

  frontend:
    build:
      context: ./tienda/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: tienda-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  pgdata:
