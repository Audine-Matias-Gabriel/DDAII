version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: webropa-postgres
    environment:
      POSTGRES_DB: webropa
      POSTGRES_USER: webropa
      POSTGRES_PASSWORD: webropa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webropa -d webropa"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: webpora-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webropa-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webropa
      SPRING_DATASOURCE_USERNAME: webropa
      SPRING_DATASOURCE_PASSWORD: webropa
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_BASE_URL: ${MP_BASE_URL}
      XIMILAR_API_KEY: ${XIMILAR_API_KEY}
      XIMILAR_COLLECTION_ID: ${XIMILAR_COLLECTION_ID}
      XIMILAR_BASE_URL: ${XIMILAR_BASE_URL}
      CORS_ORIGINS: http://localhost:5173,http://frontend
    ports:
      - "8080:8080"

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: webropa-scraper
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      TIENDA1_CATALOGO_URL: ${TIENDA1_CATALOGO_URL}
      TIENDA2_CATALOGO_URL: ${TIENDA2_CATALOGO_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webropa-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  pgdata:
