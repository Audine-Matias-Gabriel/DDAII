services:

  postgres:
    image: postgres:16-alpine
    container_name: tienda-postgres

    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: tienda-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: tienda
      RABBITMQ_DEFAULT_PASS: tienda_dev_123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
  scraper:
    tienda2:
      base-url: ${TIENDA2_BASE_URL:https://www.lasmargaritas.com.ar}
  ximilar:
    base-url: https://api.ximilar.com
    api-token: ${XIMILAR_API_TOKEN:fc75fe782aa06640ce89f0f2401238d6d6e1776a}
    collection-id: ${XIMILAR_COLLECTION_ID:c3a7cde3-abbd-40a3-8dee-7c8a66781368}
    timeout:
      connect: 3s
      read: 10s
    mock: false  # se sobreescribe con el perfil "mock"

volumes:
  postgres_data:
  rabbitmq-data:

